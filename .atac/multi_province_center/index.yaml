version: '1.0'
meta:
  name: Multi-Province Center
  description: Identify center regions for multiple provinces
inputs:
- name: provinces
  type: list
  default:
  - 四川省
  - 广东省
  - 浙江省
steps:
- type: for
  in: ${inputs.provinces}
  item: province
  steps:
  - id: geo
    type: action
    action: mcp://amap-maps/maps_geo
    args:
      address: ${variables.province}
  - id: regeo
    type: action
    action: mcp://amap-maps/maps_regeocode
    args:
      location: ${geo.output.content[0].text.return[0].location}
[project]
name = "atac"
version = "0.3.0"
description = "Recording and Replay AI Agent Trajectory."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
]

[tool.ruff.lint]
select = ["C4", "E", "F", "I", "PERF", "UP"]
ignore = ["PERF203", "E501"]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "ruff>=0.9.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"

[project.scripts]
atac = "atac.cli.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["atac*"]

[tool.setuptools.package-data]
"atac.specs.v1" = ["*.json"]

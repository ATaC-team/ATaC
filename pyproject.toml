[project]
name = "atac"
version = "1.0.0"
description = "Graph-first tool runtime for agent workflows."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.111.0",
    "langchain-core>=1.2.17",
    "langchain-mcp-adapters>=0.2.1",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[tool.ruff.lint]
select = ["C4", "E", "F", "I", "PERF", "UP"]
ignore = ["PERF203", "E501"]

[dependency-groups]
dev = [
    "langgraph>=1.0.10",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"

[project.scripts]
atac = "atac.cli.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["atac*"]
